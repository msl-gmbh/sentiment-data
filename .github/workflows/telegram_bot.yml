name: MSL Telegram Bot

# Pollt alle 5 Minuten nach neuen Telegram-Befehlen.
# Ermöglicht Werteingabe vom Handy: /putcall 0.55, /naaim 84.02, /mag7 31.5, /status

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: msl-telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Befehle abrufen und verarbeiten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram_bot.js

      - name: Änderungen committen (nur bei Änderung)
        run: |
          git config user.name "msl-telegram-bot"
          git config user.email "msl-telegram-bot@users.noreply.github.com"
          git add manual_values.json bot_state.json
          if git diff --staged --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "telegram-bot: $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
